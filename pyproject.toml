[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webseccheck"
version = "1.0.0"
description = "Ferramenta educacional para análise básica de cabeçalhos HTTP em laboratório local."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
webseccheck = "webseccheck:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["webseccheck"]
